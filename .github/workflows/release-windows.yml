# Release Windows — pubblica KaraokeManager-Setup.exe su GitHub Releases.
#
# Trigger: push tag v* (es. v2.0, v2.0.1)
# Prerequisito: il tag deve puntare a un commit con APP_VERSION allineata in config.py

name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: choco install ffmpeg -y

      - name: Install VLC
        run: choco install vlc -y

      - name: Build installer
        shell: pwsh
        env:
          KAROKAPP_GITHUB_TOKEN: ${{ secrets.KAROKAPP_UPDATE_TOKEN }}
        run: |
          $env:VlcPath = "C:\Program Files\VideoLAN\VLC"
          .\build\build_windows.ps1 -VlcPath $env:VlcPath
          $exe = "dist\KaraokeManager\KaraokeManager.exe"
          $ffmpeg = "dist\KaraokeManager\bin\ffmpeg.exe"
          if (-not (Test-Path $exe)) { throw "Manca $exe dopo build" }
          if ((Get-Item $ffmpeg).Length -lt 20MB) { throw "ffmpeg nel pacchetto è uno stub, non il binario reale" }

      - name: Delta rispetto alla release precedente
        shell: pwsh
        run: |
          $prev = "dist\previous-manifest.json"
          python build\update_package.py fetch-previous --out $prev
          if (Test-Path $prev) {
            $old = Get-Content -Raw $prev | ConvertFrom-Json
            $from = $old.version
            if (-not $from) { throw "manifest precedente senza version" }
            python build\update_package.py delta --previous $prev --dist dist\KaraokeManager --out "dist\KaraokeManager-delta-from-$from.zip"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KaraokeManager-Setup.exe
            dist/manifest.json
            dist/KaraokeManager-delta-from-*.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
